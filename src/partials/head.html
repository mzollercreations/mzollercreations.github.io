<!doctype html>
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{page_title}}</title>
<meta name="description" content="{{page_desc}}">
<meta name="theme-color" content="#ffffff">
<link rel="canonical" href="{{canonical}}">
<link rel="alternate" hreflang="de" href="{{url_de}}">
<link rel="alternate" hreflang="en" href="{{url_en}}">
<link rel="alternate" hreflang="x-default" href="{{url_de}}">
<meta property="og:type" content="website">
<meta property="og:site_name" content="{{brand}}">
<meta property="og:title" content="{{page_title}}">
<meta property="og:description" content="{{page_desc}}">
<meta property="og:url" content="{{canonical}}">
<meta property="og:image" content="{{og_image}}">
<meta property="og:locale" content="{{locale}}">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="{{base}}assets/img/favicon.svg" type="image/svg+xml">
<link rel="preload" href="{{base}}assets/fonts/geist-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="{{base}}assets/fonts/instrumentserif-italic-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="{{base}}assets/css/style.css?v={{v}}">
<script>document.documentElement.classList.add('js')</script>
</head>
