<div class="case-stats">
  <div class="cstat" data-reveal>
    <div class="cstat-num"><span data-count-from="0" data-count-to="84">84</span><small>{{unit_min}}</small></div>
    <h3>{{ss1_label}}</h3><p>{{ss1_text}}</p>
  </div>
  <div class="cstat" data-reveal style="--d:90">
    <div class="cstat-num"><span data-count-from="0" data-count-to="27">27</span><small>{{unit_sheets}}</small></div>
    <h3>{{ss2_label}}</h3><p>{{ss2_text}}</p>
  </div>
  <div class="cstat" data-reveal style="--d:180">
    <div class="cstat-num"><span data-count-from="0" data-count-to="13">13</span><small>/ 13</small></div>
    <h3>{{ss3_label}}</h3><p>{{ss3_text}}</p>
  </div>
  <div class="cstat" data-reveal style="--d:270">
    <div class="cstat-num"><span data-count-from="40" data-count-to="0">0</span></div>
    <h3>{{ss4_label}}</h3><p>{{ss4_text}}</p>
  </div>
</div>
